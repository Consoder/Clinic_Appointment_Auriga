services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      # Host port 5433, not 5432 -- a native Postgres service already owns
      # 5432 on this machine, so 5432 would silently route to the wrong DB.
      - "5433:5432"
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinic_db_data:
